<script>
particlesJS("particles-js", {
  particles: {
    number: { value: 80 },
    size: { value: 2 },
    color: { value: "#3090ff" },
    line_linked: {
      enable: true,
      distance: 150,
      color: "#3090ff",
      opacity: 0.4,
      width: 1
    },
    move: {
      speed: 1.5
    }
  },
  interactivity: {
    detect_on: "canvas",
    events: {
      onhover: {
        enable: true,
        mode: "grab"
      },
      onclick: {
        enable: true,
        mode: "repulse"
      }
    },
    modes: {
      grab: {
        distance: 150,
        line_linked: { opacity: 0.6 }
      },
       repulse: {
        distance: 150,
        duration: 0.5
      },
    }
  }
});
</script>
